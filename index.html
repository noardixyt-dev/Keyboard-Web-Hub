<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T3PA Loadcell Pedalweg-Simulator</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e24;
            color: #f5f5f7;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #ff4500;
            margin-bottom: 5px;
        }
        p.subtitle {
            color: #a0a0a5;
            margin-top: 0;
            margin-bottom: 25px;
            font-size: 0.95rem;
        }
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            max-width: 1100px;
            justify-content: center;
        }
        .panel {
            background-color: #2a2a35;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
        }
        .controls-panel {
            flex: 1;
            min-width: 320px;
            max-width: 400px;
        }
        .visual-panel {
            flex: 1.5;
            min-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .control-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 0.9rem;
        }
        input[type="range"] {
            width: 100%;
            accent-color: #ff4500;
        }
        .value-disp {
            color: #ff4500;
            font-weight: bold;
            float: right;
        }
        .results {
            background-color: #191920;
            border-left: 4px solid #ff4500;
            padding: 15px;
            border-radius: 4px;
            margin-top: 25px;
        }
        .result-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 1.05rem;
        }
        .result-item:last-child {
            margin-bottom: 0;
        }
        .highlight {
            color: #00ffcc;
            font-weight: bold;
            font-size: 1.2rem;
        }
        canvas {
            background-color: #191920;
            border-radius: 8px;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .legend {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #a0a0a5;
            display: flex;
            gap: 15px;
        }
        .legend-item span {
            display: inline-block;
            width: 12px;
            height: 12px;
            margin-right: 5px;
            vertical-align: middle;
        }
    </style>
</head>
<body>

    <h1>T3PA Loadcell Pedalweg-Simulator</h1>
    <p class="subtitle">Simuliere die Hebelwirkung und den Weg deines Drift-/GT-Setups</p>

    <div class="container">
        <!-- CONTROLS PANEL -->
        <div class="panel controls-panel">
            <div class="control-group">
                <label for="pedalLength">Gesamtlänge des Pedalarms (cm):
                    <span id="pedalLengthVal" class="value-disp">18</span>
                </label>
                <input type="range" id="pedalLength" min="15" max="25" step="1" value="18">
            </div>

            <div class="control-group">
                <label for="loadcellHeight">Montagehöhe der Loadcell (cm vom Drehpunkt):
                    <span id="loadcellHeightVal" class="value-disp">5</span>
                </label>
                <input type="range" id="loadcellHeight" min="2" max="15" step="0.5" value="5">
            </div>

            <div class="control-group">
                <label for="stackCompression">Weg des Gummi/Feder-Stacks (cm Kompression):
                    <span id="stackCompressionVal" class="value-disp">0.6</span>
                </label>
                <input type="range" id="stackCompression" min="0.2" max="1.5" step="0.1" value="0.6">
            </div>

            <div class="results">
                <div class="result-item">
                    <span>Hebelverhältnis (Fuß zu Loadcell):</span>
                    <span id="ratioResult">3.6 : 1</span>
                </div>
                <div class="result-item" style="margin-top: 10px;">
                    <span>Dein Pedalweg am Fuß (Travel):</span>
                    <span id="travelResult" class="highlight">2.16 cm</span>
                </div>
                <div class="result-item" style="font-size: 0.85rem; color: #a0a0a5; margin-top: 15px; border-top: 1px solid #333; padding-top: 10px;">
                    <span id="adviceText">Perfekt fürs Driften! Viel Weg für präzise Gewichtsverlagerung.</span>
                </div>
            </div>
        </div>

        <!-- VISUAL PANEL -->
        <div class="panel visual-panel">
            <canvas id="pedalCanvas" width="450" height="400"></canvas>
            <div class="legend">
                <div class="legend-item"><span style="background: #ff4500;"></span>Pedalarm / Fußplatte</div>
                <div class="legend-item"><span style="background: #00ffcc;"></span>Loadcell / Elastomer</div>
                <div class="legend-item"><span style="background: #555566;"></span>Basis Gehäuse</div>
            </div>
        </div>
    </div>

    <script>
        // DOM Elemente abgreifen
        const pedalLengthSlider = document.getElementById('pedalLength');
        const loadcellHeightSlider = document.getElementById('loadcellHeight');
        const stackCompressionSlider = document.getElementById('stackCompression');

        const pedalLengthVal = document.getElementById('pedalLengthVal');
        const loadcellHeightVal = document.getElementById('loadcellHeightVal');
        const stackCompressionVal = document.getElementById('stackCompressionVal');

        const ratioResult = document.getElementById('ratioResult');
        const travelResult = document.getElementById('travelResult');
        const adviceText = document.getElementById('adviceText');

        const canvas = document.getElementById('pedalCanvas');
        const ctx = canvas.getContext('2d');

        // Animation Variable
        let animPhase = 0;

        function updateSimulation() {
            // Werte aus den Slidern holen
            const L = parseFloat(pedalLengthSlider.value);
            const h = parseFloat(loadcellHeightSlider.value);
            const c = parseFloat(stackCompressionSlider.value);

            // Begrenzung: Loadcell-Höhe darf nicht länger als der Hebel sein
            if (h > L - 2) {
                loadcellHeightSlider.value = L - 2;
                return updateSimulation();
            }

            // Werte in der GUI updaten
            pedalLengthVal.innerText = L;
            loadcellHeightVal.innerText = h;
            stackCompressionVal.innerText = c;

            // Berechnung über das Hebelgesetz (Strahlensatz)
            // Weg am Fuß (T) / Kompression am Stack (c) = Länge Arm (L) / Höhe Loadcell (h)
            const ratio = L / h;
            const pedalTravel = c * ratio;

            // Ergebnisse anzeigen
            ratioResult.innerText = ratio.toFixed(1) + " : 1";
            travelResult.innerText = pedalTravel.toFixed(2) + " cm";

            // Fahrempfehlungs-Text dynamisch anpassen
            if (pedalTravel < 1.0) {
                adviceText.innerText = "🏎️ F1 / Formel-Setup: Extrem harter, kurzer Weg. Perfekt für reines Muskelgedächtnis, ungeeignet zum Driften.";
                adviceText.style.color = "#ff6666";
            } else if (pedalTravel >= 1.0 && pedalTravel <= 2.2) {
                adviceText.innerText = "🏁 GT3 / Allround-Setup: Optimaler Kompromiss. Genug Weg für No Hesi Trail-Braking und solide Wand beim harten Stoppen.";
                adviceText.style.color = "#00ffcc";
            } else {
                adviceText.innerText = "🔄 Drift / Street-Setup: Hervorragend! Sehr viel Pedalweg vorhanden. Perfekt, um das Auto sanft anzustellen und das Gewicht zu verlagern.";
                adviceText.style.color = "#66ccff";
            }

            drawPedal(L, h, c, pedalTravel);
        }

        function drawPedal(L, h, c, totalTravel) {
            // Canvas löschen
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Skalierungsfaktor von cm zu Pixeln (z.B. 1 cm = 15 Pixel)
            const scale = 15;

            // Fixer Drehpunkt (Pivot) des Pedals im Canvas unten links
            const pivotX = 120;
            const pivotY = 350;

            // Animierte Bremsbetätigung (Sinus-Welle für flüssiges Drücken und Loslassen)
            animPhase += 0.04;
            const currentPressFactor = (Math.sin(animPhase) + 1) / 2; // Wert zwischen 0 und 1

            // Berechne den aktuellen Winkel des Pedals im Ruhezustand (ca. 75 Grad zur Horizontalen)
            const baseAngle = -75 * Math.PI / 180;
            
            // Maximaler Auslenkungswinkel basierend auf dem errechneten Travel am oberen Ende
            // Bogenmaß Annäherung: Winkel = Weg / Länge
            const maxAlpha = (totalTravel / L);
            const currentAlpha = maxAlpha * currentPressFactor;
            const currentAngle = baseAngle + currentAlpha;

            // --- 1. GEHÄUSE / PLASTIKBASIS ZEICHNEN ---
            ctx.strokeStyle = "#555566";
            ctx.lineWidth = 10;
            ctx.lineCap = "round";
            ctx.beginPath();
            ctx.moveTo(30, pivotY + 20);
            ctx.lineTo(400, pivotY + 20); // Bodenplatte
            ctx.stroke();

            // Rückwand des Gehäuses (wo das Schraubloch/Halterung sitzt)
            ctx.lineWidth = 6;
            ctx.beginPath();
            ctx.moveTo(350, pivotY + 20);
